<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" role="img" aria-labelledby="title"><title id="title">AccordFlow</title><style>text{font-family:Segoe UI,Arial,sans-serif}.trace{stroke-dasharray:100;stroke-dashoffset:0;animation:draw 7s ease-in-out infinite}.pulse{animation:pulse 7s ease-in-out infinite}@keyframes draw{0%,100%{stroke-dashoffset:0}45%{stroke-dashoffset:100}75%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.trace,.pulse{animation:none}}</style><rect x=".5" y=".5" width="339" height="63" rx="8" fill="#0c1729" stroke="#29415e"/><g transform="translate(12 14) scale(.5)" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h24l12 12v38H18zM42 10v14h12M26 34h20M26 43h12"/><path class="trace" d="m30 53 6 6 13-14"/></g><text x="64" y="41" fill="#f0f6fc" font-size="26" font-weight="600">AccordFlow</text></svg>