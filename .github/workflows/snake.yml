name: Contribution animation

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: read

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: rehmatwadii
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230969da&color_dots=%23ebedf0,%23c5eaf3,%2384d8dc,%2334b3b1,%230e7490
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%235eead4&color_dots=%23162236,%23203b55,%23236685,%23209da4,%235eead4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated assets to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          git init --initial-branch=output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m 'Update contribution animations'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force "https://github.com/$GH_REPO.git" HEAD:output
